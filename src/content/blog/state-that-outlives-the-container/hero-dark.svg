<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (mirrored variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-state" cx="80%" cy="80%" r="70%">
			<stop offset="0%" stop-color="#1A1A1A"/>
			<stop offset="100%" stop-color="#0D0D0D"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-state" cx="85%" cy="72%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.08"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-state" x1="91%" y1="79%" x2="9%" y2="21%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.035"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-state" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-state" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#262626" stroke-width="1" stroke-opacity="0.4"/>
			<circle cx="60" cy="60" r="1.5" fill="#4C4C4C" opacity="0.3"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (mirrored variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-state)"/>
		<rect width="1920" height="1080" fill="url(#grid-state)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-state)"/>
		<rect width="1920" height="1080" fill="url(#sweep-state)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1100 1080 L 1100 840 L 1380 560 L 1920 560" stroke="#262626" stroke-width="12"/>
			<path d="M 1300 1080 L 1300 900 L 1650 550 L 1650 0" stroke="#1A1A1A" stroke-width="8"/>
			<path d="M 800 0 L 1150 350 L 1920 350" stroke="#262626" stroke-width="6"/>
		</g>
		<circle cx="1380" cy="560" r="10" fill="#262626"/>
		<circle cx="1150" cy="350" r="8" fill="#4C4C4C"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1750 860 L 1830 860 L 1770 920 L 1830 920" fill="none" stroke="#262626" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

		<!-- Subtle Dark Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 990 L 2020 990" stroke="#262626" stroke-width="8"/>
		</g>

		<!-- Timeline the scheduled runs sit on -->
		<path d="M -100 930 L 2020 930" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round"/>

		<!-- Shared state bus: every run, past or present, wires into the same store -->
		<path d="M 220 745 L 1460 745" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
		<g fill="none" stroke="#4C4C4C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14">
			<path d="M 220 800 L 220 745"/>
			<path d="M 520 800 L 520 745"/>
			<path d="M 820 800 L 820 745"/>
		</g>

		<!-- Past runs: their containers are already gone -->
		<g fill="none" stroke="#4C4C4C" stroke-width="4" stroke-dasharray="14 12">
			<rect x="150" y="800" width="140" height="110" rx="10"/>
			<rect x="450" y="800" width="140" height="110" rx="10"/>
			<rect x="750" y="800" width="140" height="110" rx="10"/>
		</g>

		<!-- This run's container -->
		<rect x="1050" y="800" width="140" height="110" rx="10" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7" filter="url(#yellow-glow-state)"/>
		<path d="M 1120 800 L 1120 745 L 1460 745 L 1460 660" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1120" cy="745" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-state)"/>

		<!-- The next run hasn't started yet -->
		<rect x="1350" y="830" width="100" height="80" rx="8" fill="none" stroke="#262626" stroke-width="4" stroke-dasharray="10 10"/>

		<!-- The persistent state store -->
		<g fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7">
			<path d="M 1340 500 L 1340 640 A 120 30 0 0 0 1580 640 L 1580 500"/>
			<ellipse cx="1460" cy="500" rx="120" ry="30"/>
		</g>
		<path d="M 1340 570 A 120 30 0 0 0 1580 570" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="4" opacity="0.6"/>

	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#F2F2F2">State that outlives</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">the container</text>
</svg>
