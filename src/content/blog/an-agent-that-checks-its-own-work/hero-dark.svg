<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (mirrored variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-agent" cx="80%" cy="80%" r="70%">
			<stop offset="0%" stop-color="#1A1A1A"/>
			<stop offset="100%" stop-color="#0D0D0D"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-agent" cx="70%" cy="75%" r="38%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.08"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-agent" x1="91%" y1="79%" x2="9%" y2="21%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.035"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-agent" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-agent" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#262626" stroke-width="1" stroke-opacity="0.4"/>
			<circle cx="60" cy="60" r="1.5" fill="#4C4C4C" opacity="0.3"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep -->
		<rect width="1920" height="1080" fill="url(#bg-glow-agent)"/>
		<rect width="1920" height="1080" fill="url(#grid-agent)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-agent)"/>
		<rect width="1920" height="1080" fill="url(#sweep-agent)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1250 0 L 1250 180 L 1450 380 L 1920 380" stroke="#262626" stroke-width="10"/>
			<path d="M 1920 1000 L 1780 1000 L 1700 1080" stroke="#1A1A1A" stroke-width="8"/>
			<path d="M -100 1020 L 2020 1020" stroke="#262626" stroke-width="8"/>
		</g>
		<circle cx="1450" cy="380" r="9" fill="#4C4C4C"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1770 120 L 1850 120 L 1790 180 L 1850 180" fill="none" stroke="#262626" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

		<!-- The agent's terminal, on its side of the protocol -->
		<rect x="180" y="760" width="300" height="190" rx="14" fill="#0D0D0D" stroke="#4C4C4C" stroke-width="5"/>
		<path d="M 180 805 L 480 805" stroke="#4C4C4C" stroke-width="4"/>
		<g fill="#4C4C4C">
			<circle cx="210" cy="783" r="7"/>
			<circle cx="236" cy="783" r="7"/>
			<circle cx="262" cy="783" r="7"/>
		</g>
		<path d="M 215 845 L 240 865 L 215 885" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
		<g stroke="#4C4C4C" stroke-width="7" stroke-linecap="round">
			<path d="M 265 865 L 400 865"/>
			<path d="M 215 915 L 330 915"/>
		</g>

		<!-- The protocol boundary between agent and pz -->
		<path d="M 760 745 L 760 990" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round"/>

		<!-- The loop: an edit goes out, the verification comes straight back -->
		<g fill="none" stroke="hsl(46, 96%, 50%)" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 480 820 L 1300 820" stroke-width="10"/>
			<path d="M 1270 795 L 1300 820 L 1270 845" stroke-width="10"/>
			<path d="M 1300 895 L 480 895" stroke-width="6" stroke-dasharray="22 16" opacity="0.75"/>
			<path d="M 510 870 L 480 895 L 510 920" stroke-width="6" opacity="0.75"/>
		</g>

		<!-- The project: connections.yml over a pipeline file -->
		<rect x="1345" y="735" width="250" height="250" rx="14" fill="#0D0D0D" stroke="#4C4C4C" stroke-width="5"/>
		<rect x="1310" y="700" width="250" height="250" rx="14" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7" filter="url(#yellow-glow-agent)"/>
		<g stroke="#4C4C4C" stroke-width="7" stroke-linecap="round">
			<path d="M 1350 755 L 1470 755"/>
			<path d="M 1380 795 L 1510 795"/>
			<path d="M 1380 835 L 1480 835"/>
			<path d="M 1350 875 L 1440 875"/>
		</g>
		<!-- Self-verify passed -->
		<circle cx="1545" cy="925" r="34" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
		<path d="M 1528 925 L 1541 939 L 1564 912" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

		<!-- The run tools: present only when the server was started with allow-run -->
		<path d="M 1435 700 L 1435 600" fill="none" stroke="#4C4C4C" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round"/>
		<rect x="1345" y="440" width="180" height="160" rx="14" fill="none" stroke="#4C4C4C" stroke-width="5" stroke-dasharray="16 12"/>
		<g fill="none" stroke="#4C4C4C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1412 520 L 1412 495 A 23 23 0 0 1 1458 495 L 1458 520"/>
			<rect x="1398" y="520" width="74" height="55" rx="8"/>
		</g>
		<circle cx="1435" cy="545" r="6" fill="#4C4C4C"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#F2F2F2">An agent that</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">checks its own work</text>
</svg>
