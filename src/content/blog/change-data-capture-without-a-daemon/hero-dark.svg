<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (risers variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-cdc" cx="85%" cy="45%" r="70%">
			<stop offset="0%" stop-color="#1A1A1A"/>
			<stop offset="100%" stop-color="#0D0D0D"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-cdc" cx="88%" cy="50%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.08"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-cdc" x1="97%" y1="67%" x2="3%" y2="33%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.035"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-cdc" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-cdc" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#262626" stroke-width="1" stroke-opacity="0.4"/>
			<circle cx="60" cy="60" r="1.5" fill="#4C4C4C" opacity="0.3"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (risers variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-cdc)"/>
		<rect width="1920" height="1080" fill="url(#grid-cdc)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-cdc)"/>
		<rect width="1920" height="1080" fill="url(#sweep-cdc)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1180 1080 L 1180 520 L 1460 240 L 1920 240" stroke="#262626" stroke-width="12"/>
			<path d="M 1560 1080 L 1560 760 L 1760 560 L 1920 560" stroke="#1A1A1A" stroke-width="8"/>
			<path d="M 1000 0 L 1000 200 L 1180 380" stroke="#262626" stroke-width="6"/>
		</g>
		<circle cx="1460" cy="240" r="10" fill="#262626"/>
		<circle cx="1560" cy="760" r="8" fill="#4C4C4C"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1750 860 L 1830 860 L 1770 920 L 1830 920" fill="none" stroke="#262626" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

		<!-- Subtle Dark Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 930 L 2020 930" stroke="#1A1A1A" stroke-width="24"/>
			<path d="M -100 990 L 2020 990" stroke="#262626" stroke-width="8"/>
		</g>

		<!-- Previous run's window, already drained -->
		<g fill="none" stroke="#4C4C4C" stroke-width="4" stroke-linecap="round">
			<path d="M 560 790 L 540 790 L 540 930 L 560 930"/>
			<path d="M 1000 790 L 1020 790 L 1020 930 L 1000 930"/>
		</g>

		<!-- This run's window -->
		<g fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="5" stroke-linecap="round">
			<path d="M 1100 790 L 1080 790 L 1080 930 L 1100 930"/>
			<path d="M 1480 790 L 1500 790 L 1500 930 L 1480 930"/>
		</g>

		<!-- The change log -->
		<path d="M -100 860 L 2020 860" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
		<path d="M 1080 860 L 1500 860" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round"/>

		<!-- Change events: solid = insert or update, hollow = delete -->
		<g>
			<circle cx="140" cy="860" r="10" fill="#4C4C4C"/>
			<circle cx="280" cy="860" r="10" fill="#4C4C4C"/>
			<circle cx="420" cy="860" r="10" fill="#0D0D0D" stroke="#4C4C4C" stroke-width="5"/>
			<circle cx="620" cy="860" r="10" fill="#4C4C4C"/>
			<circle cx="740" cy="860" r="10" fill="#0D0D0D" stroke="#4C4C4C" stroke-width="5"/>
			<circle cx="860" cy="860" r="10" fill="#4C4C4C"/>
			<circle cx="950" cy="860" r="10" fill="#4C4C4C"/>

			<circle cx="1150" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-cdc)"/>
			<circle cx="1250" cy="860" r="13" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="6"/>
			<circle cx="1340" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-cdc)"/>
			<circle cx="1430" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-cdc)"/>

			<circle cx="1620" cy="860" r="10" fill="#333333"/>
			<circle cx="1760" cy="860" r="10" fill="#0D0D0D" stroke="#333333" stroke-width="5"/>
		</g>

		<!-- Drain: the window rises into the sink -->
		<path d="M 1290 790 L 1290 640 L 1520 410 L 2020 410" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1520" cy="410" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-cdc)"/>
		<circle cx="1760" cy="410" r="18" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#F2F2F2">Change data</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">capture</text>
</svg>
