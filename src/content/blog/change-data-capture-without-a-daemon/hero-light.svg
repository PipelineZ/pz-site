<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Light Background Radial Glow -->
		<radialGradient id="bg-grad-light-cdc" cx="20%" cy="50%" r="90%">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="100%" stop-color="#FAFAFA"/>
		</radialGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-light-cdc" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Linear Grid -->
		<pattern id="grid-lines-light-cdc" width="80" height="80" patternUnits="userSpaceOnUse">
			<path d="M 80 0 L 0 0 0 80" fill="none" stroke="#E6E6E6" stroke-width="1" opacity="0.6"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface -->
		<rect width="1920" height="1080" fill="url(#bg-grad-light-cdc)"/>
		<rect width="1920" height="1080" fill="url(#grid-lines-light-cdc)"/>

		<!-- Subtle Light Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 930 L 2020 930" stroke="#F6F6F6" stroke-width="24"/>
			<path d="M -100 990 L 2020 990" stroke="#E6E6E6" stroke-width="8"/>
		</g>

		<!-- Previous run's window, already drained -->
		<g fill="none" stroke="#CCCCCC" stroke-width="4" stroke-linecap="round">
			<path d="M 560 790 L 540 790 L 540 930 L 560 930"/>
			<path d="M 1000 790 L 1020 790 L 1020 930 L 1000 930"/>
		</g>

		<!-- This run's window -->
		<g fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="5" stroke-linecap="round">
			<path d="M 1100 790 L 1080 790 L 1080 930 L 1100 930"/>
			<path d="M 1480 790 L 1500 790 L 1500 930 L 1480 930"/>
		</g>

		<!-- The change log -->
		<path d="M -100 860 L 2020 860" fill="none" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round"/>
		<path d="M 1080 860 L 1500 860" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round"/>

		<!-- Change events: solid = insert or update, hollow = delete -->
		<g>
			<circle cx="140" cy="860" r="10" fill="#CCCCCC"/>
			<circle cx="280" cy="860" r="10" fill="#CCCCCC"/>
			<circle cx="420" cy="860" r="10" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="5"/>
			<circle cx="620" cy="860" r="10" fill="#CCCCCC"/>
			<circle cx="740" cy="860" r="10" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="5"/>
			<circle cx="860" cy="860" r="10" fill="#CCCCCC"/>
			<circle cx="950" cy="860" r="10" fill="#CCCCCC"/>

			<circle cx="1150" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-cdc)"/>
			<circle cx="1250" cy="860" r="13" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="6"/>
			<circle cx="1340" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-cdc)"/>
			<circle cx="1430" cy="860" r="13" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-cdc)"/>

			<circle cx="1620" cy="860" r="10" fill="#DDDDDD"/>
			<circle cx="1760" cy="860" r="10" fill="#FAFAFA" stroke="#DDDDDD" stroke-width="5"/>
		</g>

		<!-- Drain: the window rises into the sink -->
		<path d="M 1290 790 L 1290 640 L 1520 410 L 2020 410" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1520" cy="410" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-cdc)"/>
		<circle cx="1760" cy="410" r="18" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>

		<!-- Corner Decorative Accent Block -->
		<path d="M 1840 120 L 1880 120 L 1880 160" fill="none" stroke="#CCCCCC" stroke-width="3"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="220" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#0D0D0D">Change data</text>
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">capture</text>
</svg>
