<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (stepped variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-light-slices" cx="70%" cy="15%" r="70%">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="100%" stop-color="#FAFAFA"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-light-slices" cx="72%" cy="22%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.12"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-light-slices" x1="98%" y1="37%" x2="2%" y2="63%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.03"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-light-slices" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-light-slices" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E6E6E6" stroke-width="1" stroke-opacity="0.6"/>
			<circle cx="60" cy="60" r="1.5" fill="#CCCCCC" opacity="0.6"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (stepped variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-light-slices)"/>
		<rect width="1920" height="1080" fill="url(#grid-light-slices)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-light-slices)"/>
		<rect width="1920" height="1080" fill="url(#sweep-light-slices)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 600 0 L 600 90 L 980 90 L 1220 330 L 1920 330" stroke="#E6E6E6" stroke-width="12"/>
			<path d="M 1500 0 L 1500 200 L 1800 500 L 1800 1080" stroke="#F6F6F6" stroke-width="8"/>
			<path d="M 1050 1080 L 1300 830 L 1920 830" stroke="#E6E6E6" stroke-width="6"/>
		</g>
		<circle cx="1220" cy="330" r="10" fill="#E6E6E6"/>
		<circle cx="1300" cy="830" r="8" fill="#CCCCCC"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1620 120 L 1700 120 L 1640 180 L 1700 180" fill="none" stroke="#E6E6E6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

		<!-- Subtle Light Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 960 L 2020 960" stroke="#F6F6F6" stroke-width="24"/>
			<path d="M -100 1010 L 2020 1010" stroke="#E6E6E6" stroke-width="8"/>
		</g>

		<!-- The backlog: committed slices, solid grey -->
		<g fill="#CCCCCC">
			<rect x="120" y="820" width="140" height="80" rx="6"/>
			<rect x="280" y="820" width="140" height="80" rx="6"/>
			<rect x="440" y="820" width="140" height="80" rx="6"/>
			<rect x="600" y="820" width="140" height="80" rx="6"/>
			<rect x="760" y="820" width="140" height="80" rx="6"/>
		</g>

		<!-- This run's slice -->
		<rect x="920" y="820" width="140" height="80" rx="6" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-slices)"/>

		<!-- Slices still to come, outlined -->
		<g fill="none" stroke="#DDDDDD" stroke-width="5">
			<rect x="1080" y="820" width="140" height="80" rx="6"/>
			<rect x="1240" y="820" width="140" height="80" rx="6"/>
			<rect x="1400" y="820" width="140" height="80" rx="6"/>
			<rect x="1560" y="820" width="140" height="80" rx="6"/>
		</g>

		<!-- Watermark tick, between the committed backlog and this run's slice -->
		<path d="M 910 790 L 910 930" fill="none" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>

		<!-- until: the flag at the end of the backlog -->
		<g fill="none" stroke="#CCCCCC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1730 930 L 1730 700"/>
			<path d="M 1730 700 L 1800 724 L 1730 748"/>
		</g>

		<!-- Load: this run's slice rises into the sink -->
		<path d="M 990 820 L 990 640 L 1220 410 L 2020 410" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1220" cy="410" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-slices)"/>
		<circle cx="1560" cy="410" r="18" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#0D0D0D">Backfill</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">in slices</text>
</svg>
