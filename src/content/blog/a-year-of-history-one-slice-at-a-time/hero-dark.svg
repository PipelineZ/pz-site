<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Dark Background Radial Glow -->
		<radialGradient id="bg-grad-slices" cx="20%" cy="50%" r="90%">
			<stop offset="0%" stop-color="#1A1A1A"/>
			<stop offset="100%" stop-color="#0D0D0D"/>
		</radialGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-slices" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Linear Grid -->
		<pattern id="grid-lines-slices" width="80" height="80" patternUnits="userSpaceOnUse">
			<path d="M 80 0 L 0 0 0 80" fill="none" stroke="#262626" stroke-width="1" opacity="0.35"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface -->
		<rect width="1920" height="1080" fill="url(#bg-grad-slices)"/>
		<rect width="1920" height="1080" fill="url(#grid-lines-slices)"/>

		<!-- Subtle Dark Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 960 L 2020 960" stroke="#1A1A1A" stroke-width="24"/>
			<path d="M -100 1010 L 2020 1010" stroke="#262626" stroke-width="8"/>
		</g>

		<!-- The backlog: committed slices, solid grey -->
		<g fill="#4C4C4C">
			<rect x="120" y="820" width="140" height="80" rx="6"/>
			<rect x="280" y="820" width="140" height="80" rx="6"/>
			<rect x="440" y="820" width="140" height="80" rx="6"/>
			<rect x="600" y="820" width="140" height="80" rx="6"/>
			<rect x="760" y="820" width="140" height="80" rx="6"/>
		</g>

		<!-- This run's slice -->
		<rect x="920" y="820" width="140" height="80" rx="6" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-slices)"/>

		<!-- Slices still to come, outlined -->
		<g fill="none" stroke="#333333" stroke-width="5">
			<rect x="1080" y="820" width="140" height="80" rx="6"/>
			<rect x="1240" y="820" width="140" height="80" rx="6"/>
			<rect x="1400" y="820" width="140" height="80" rx="6"/>
			<rect x="1560" y="820" width="140" height="80" rx="6"/>
		</g>

		<!-- Watermark tick, between the committed backlog and this run's slice -->
		<path d="M 910 790 L 910 930" fill="none" stroke="#F2F2F2" stroke-width="4" stroke-linecap="round"/>

		<!-- until: the flag at the end of the backlog -->
		<g fill="none" stroke="#4C4C4C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1730 930 L 1730 700"/>
			<path d="M 1730 700 L 1800 724 L 1730 748"/>
		</g>

		<!-- Load: this run's slice rises into the sink -->
		<path d="M 990 820 L 990 640 L 1220 410 L 2020 410" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1220" cy="410" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-slices)"/>
		<circle cx="1560" cy="410" r="18" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>

		<!-- Corner Decorative Accent Block -->
		<path d="M 1840 120 L 1880 120 L 1880 160" fill="none" stroke="#4C4C4C" stroke-width="3"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="220" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#F2F2F2">Backfill</text>
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">in slices</text>
</svg>
