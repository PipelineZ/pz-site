<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (stepped variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-drift" cx="70%" cy="15%" r="70%">
			<stop offset="0%" stop-color="#1A1A1A"/>
			<stop offset="100%" stop-color="#0D0D0D"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-drift" cx="72%" cy="22%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.08"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-drift" x1="67%" y1="3%" x2="33%" y2="97%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.035"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-drift" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-drift" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#262626" stroke-width="1" stroke-opacity="0.4"/>
			<circle cx="60" cy="60" r="1.5" fill="#4C4C4C" opacity="0.3"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (stepped variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-drift)"/>
		<rect width="1920" height="1080" fill="url(#grid-drift)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-drift)"/>
		<rect width="1920" height="1080" fill="url(#sweep-drift)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 600 0 L 600 90 L 980 90 L 1220 330 L 1920 330" stroke="#262626" stroke-width="12"/>
			<path d="M 1500 0 L 1500 200 L 1800 500 L 1800 1080" stroke="#1A1A1A" stroke-width="8"/>
			<path d="M 1050 1080 L 1300 830 L 1920 830" stroke="#262626" stroke-width="6"/>
		</g>
		<circle cx="1220" cy="330" r="10" fill="#262626"/>
		<circle cx="1300" cy="830" r="8" fill="#4C4C4C"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1620 120 L 1700 120 L 1640 180 L 1700 180" fill="none" stroke="#262626" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

		<!-- Subtle Dark Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 960 L 2020 960" stroke="#1A1A1A" stroke-width="24"/>
			<path d="M -100 1010 L 2020 1010" stroke="#262626" stroke-width="8"/>
		</g>

		<!-- Floor every column stands on -->
		<path d="M 920 900 L 1880 900" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round"/>

		<!-- Accepted baseline: one dashed outline per column -->
		<g fill="none" stroke="#4C4C4C" stroke-width="4" stroke-dasharray="14 10">
			<rect x="990" y="590" width="130" height="310" rx="6"/>
			<rect x="1160" y="670" width="130" height="230" rx="6"/>
			<rect x="1330" y="650" width="130" height="250" rx="6"/>
			<rect x="1500" y="630" width="130" height="270" rx="6"/>
			<rect x="1670" y="550" width="130" height="350" rx="6"/>
		</g>

		<!-- Observed columns that still match their outline -->
		<g fill="#4C4C4C">
			<rect x="1005" y="605" width="100" height="295" rx="4"/>
			<rect x="1175" y="685" width="100" height="215" rx="4"/>
			<rect x="1515" y="645" width="100" height="255" rx="4"/>
			<rect x="1685" y="565" width="100" height="335" rx="4"/>
		</g>

		<!-- The drifted column: a different shape, spilling past its outline -->
		<rect x="1375" y="470" width="70" height="430" rx="4" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-drift)"/>

		<!-- Flag on the change -->
		<path d="M 1410 440 L 1410 360" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="5" stroke-linecap="round"/>
		<path d="M 1410 360 L 1462 376 L 1410 392 Z" fill="hsl(46, 96%, 50%)"/>

	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#F2F2F2">Schema</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">drift</text>
</svg>
