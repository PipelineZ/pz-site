<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (mirrored variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-light-checks" cx="80%" cy="80%" r="70%">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="100%" stop-color="#FAFAFA"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-light-checks" cx="85%" cy="72%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.12"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-light-checks" x1="88%" y1="18%" x2="12%" y2="82%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.03"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-light-checks" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-light-checks" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E6E6E6" stroke-width="1" stroke-opacity="0.6"/>
			<circle cx="60" cy="60" r="1.5" fill="#CCCCCC" opacity="0.6"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (mirrored variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-light-checks)"/>
		<rect width="1920" height="1080" fill="url(#grid-light-checks)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-light-checks)"/>
		<rect width="1920" height="1080" fill="url(#sweep-light-checks)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1100 1080 L 1100 840 L 1380 560 L 1920 560" stroke="#E6E6E6" stroke-width="12"/>
			<path d="M 1300 1080 L 1300 900 L 1650 550 L 1650 0" stroke="#F6F6F6" stroke-width="8"/>
			<path d="M 800 0 L 1150 350 L 1920 350" stroke="#E6E6E6" stroke-width="6"/>
		</g>
		<circle cx="1380" cy="560" r="10" fill="#E6E6E6"/>
		<circle cx="1150" cy="350" r="8" fill="#CCCCCC"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1750 860 L 1830 860 L 1770 920 L 1830 920" fill="none" stroke="#E6E6E6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

		<!-- Subtle Light Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 990 L 2020 990" stroke="#F6F6F6" stroke-width="24"/>
			<path d="M -100 1035 L 2020 1035" stroke="#E6E6E6" stroke-width="8"/>
		</g>

		<!-- Probes: each check hangs off the graph and watches, without sitting in the flow -->
		<g fill="none" stroke="#CCCCCC" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14">
			<path d="M 520 800 L 520 882"/>
			<path d="M 1520 580 L 1520 662"/>
		</g>
		<path d="M 980 800 L 980 882" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>

		<!-- The pipeline: one path, never interrupted -->
		<path d="M -100 800 L 980 800 L 1200 580 L 2020 580" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="520" cy="800" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-checks)"/>
		<circle cx="980" cy="800" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-checks)"/>
		<circle cx="1200" cy="580" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-checks)"/>
		<circle cx="1520" cy="580" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-checks)"/>
		<circle cx="1780" cy="580" r="18" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>

		<!-- Passing checks -->
		<g fill="#FAFAFA" stroke="#CCCCCC" stroke-width="6">
			<circle cx="520" cy="930" r="40"/>
			<circle cx="1520" cy="710" r="40"/>
		</g>
		<g fill="none" stroke="#CCCCCC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 501 931 L 515 946 L 541 915"/>
			<path d="M 1501 711 L 1515 726 L 1541 695"/>
		</g>

		<!-- A failing check: it flags the problem, and the pipeline keeps flowing past it -->
		<circle cx="980" cy="930" r="40" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="6" filter="url(#yellow-glow-light-checks)"/>
		<path d="M 980 910 L 980 935" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="7" stroke-linecap="round"/>
		<circle cx="980" cy="952" r="5.5" fill="hsl(46, 96%, 50%)"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#0D0D0D">Checks,</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">not gates</text>
</svg>
