<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<!-- Background gradient base (mirrored variant of the pipeline-circuit background) -->
		<radialGradient id="bg-glow-light-retry" cx="80%" cy="80%" r="70%">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="100%" stop-color="#FAFAFA"/>
		</radialGradient>

		<!-- Subtle Accent Glow -->
		<radialGradient id="accent-glow-light-retry" cx="85%" cy="72%" r="35%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.12"/>
			<stop offset="100%" stop-color="#FAC409" stop-opacity="0"/>
		</radialGradient>

		<!-- Faint Warm Sweep -->
		<linearGradient id="sweep-light-retry" x1="82%" y1="88%" x2="18%" y2="12%">
			<stop offset="0%" stop-color="#FAC409" stop-opacity="0.03"/>
			<stop offset="60%" stop-color="#FAC409" stop-opacity="0"/>
		</linearGradient>

		<!-- Accent Glow Filter -->
		<filter id="yellow-glow-light-retry" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>

		<!-- Background Grid Pattern -->
		<pattern id="grid-light-retry" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E6E6E6" stroke-width="1" stroke-opacity="0.6"/>
			<circle cx="60" cy="60" r="1.5" fill="#CCCCCC" opacity="0.6"/>
		</pattern>
	</defs>

	<!-- Background artwork, drawn at its native 1920x1080 and center-cropped to this
	     post's 1200x630 hero frame (nested <svg> clips to its box by default). -->
	<svg x="0" y="-22.5" width="1200" height="675" viewBox="0 0 1920 1080">
		<!-- Base Surface, Grid, Ambient Accent, and Sweep (mirrored variant) -->
		<rect width="1920" height="1080" fill="url(#bg-glow-light-retry)"/>
		<rect width="1920" height="1080" fill="url(#grid-light-retry)"/>
		<rect width="1920" height="1080" fill="url(#accent-glow-light-retry)"/>
		<rect width="1920" height="1080" fill="url(#sweep-light-retry)"/>

		<!-- Background Pipeline Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M 1100 1080 L 1100 840 L 1380 560 L 1920 560" stroke="#E6E6E6" stroke-width="12"/>
			<path d="M 1300 1080 L 1300 900 L 1650 550 L 1650 0" stroke="#F6F6F6" stroke-width="8"/>
			<path d="M 800 0 L 1150 350 L 1920 350" stroke="#E6E6E6" stroke-width="6"/>
		</g>
		<circle cx="1380" cy="560" r="10" fill="#E6E6E6"/>
		<circle cx="1150" cy="350" r="8" fill="#CCCCCC"/>

		<!-- Watermark Z Silhouette -->
		<path d="M 1750 860 L 1830 860 L 1770 920 L 1830 920" fill="none" stroke="#E6E6E6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

		<!-- Subtle Light Background Tracks -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M -100 960 L 2020 960" stroke="#F6F6F6" stroke-width="24"/>
			<path d="M -100 1010 L 2020 1010" stroke="#E6E6E6" stroke-width="8"/>
		</g>

		<!-- The failed run: one path through the nodes, broken before the last write -->
		<path d="M 120 820 L 1300 820" fill="none" stroke="#DDDDDD" stroke-width="10" stroke-linecap="round"/>
		<path d="M 1460 820 L 1700 820" fill="none" stroke="#DDDDDD" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 26"/>

		<!-- Reads and the committed write that landed: solid grey -->
		<g fill="#CCCCCC">
			<circle cx="240" cy="820" r="34"/>
			<circle cx="520" cy="820" r="34"/>
			<circle cx="800" cy="820" r="34"/>
			<circle cx="1080" cy="820" r="34"/>
		</g>

		<!-- The break: the write that failed -->
		<g fill="none" stroke="#CCCCCC" stroke-width="7" stroke-linecap="round">
			<path d="M 1350 770 L 1410 870"/>
			<path d="M 1410 770 L 1350 870"/>
		</g>

		<!-- The retry: picks up from what landed and finishes the run -->
		<path d="M 1080 786 L 1080 640 L 1380 640 L 1600 420 L 2020 420" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="1080" cy="640" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-retry)"/>
		<circle cx="1600" cy="420" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow-light-retry)"/>
		<circle cx="1800" cy="420" r="18" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
	</svg>

	<!-- Post heading, overlaid on the plainer upper-left of the cropped background -->
	<text x="70" y="300" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#0D0D0D">Retry,</text>
	<text x="70" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FAC409">not rerun</text>
</svg>
