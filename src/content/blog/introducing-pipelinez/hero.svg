<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#17171a" />
			<stop offset="100%" stop-color="#332a08" />
		</linearGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#g)" />
	<circle cx="1000" cy="120" r="240" fill="#FAC105" opacity="0.08" />
	<circle cx="140" cy="520" r="200" fill="#FAC105" opacity="0.1" />

	<!-- sources -> pz -> sink, a tiny pipeline diagram -->
	<g stroke="#FAC105" stroke-width="2" opacity="0.55" fill="none">
		<path d="M120 220 L 350 300" />
		<path d="M120 300 L 350 300" />
		<path d="M120 380 L 350 300" />
		<path d="M510 300 L 900 300" />
	</g>
	<g>
		<circle cx="120" cy="220" r="7" fill="#8a8a8a" />
		<circle cx="120" cy="300" r="7" fill="#8a8a8a" />
		<circle cx="120" cy="380" r="7" fill="#8a8a8a" />
		<circle cx="900" cy="300" r="9" fill="#f2f2f2" />
	</g>

	<!-- the pz mark (see public/favicon.svg), scaled up as the pipeline's center node -->
	<g transform="translate(350 220) scale(1.25)">
		<rect width="128" height="128" rx="30" fill="#1B1815" />
		<path d="M36 39 H92 L36 89 H92" fill="none" stroke="#FAC105" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
		<circle cx="92" cy="39" r="9.5" fill="#FAC105" />
		<circle cx="36" cy="89" r="9.5" fill="#FAC105" />
		<circle cx="92" cy="89" r="9.5" fill="#FAC105" />
		<circle cx="36" cy="39" r="8.5" fill="#1B1815" stroke="#FAC105" stroke-width="5.5" />
	</g>

	<text x="80" y="470" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#f2f2f2">
		Introducing PipelineZ
	</text>
	<text x="80" y="512" font-family="Arial, sans-serif" font-size="24" fill="#b2b2b2">
		A lightweight batch pipeline engine for people who just want to write SQL.
	</text>
</svg>
