<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Dark Background Radial Glow -->
    <radialGradient id="bg-grad-1" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>

    <!-- Accent Glow Filter -->
    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Linear Grid -->
    <pattern id="grid-lines" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#262626" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base Surface -->
  <rect width="100%" height="100%" fill="url(#bg-grad-1)"/>
  <rect width="100%" height="100%" fill="url(#grid-lines)"/>

  <!-- Subtle Dark Background Tracks -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -100 850 L 500 850 L 850 500 L 1400 500 L 1750 150 L 2020 150" stroke="#1A1A1A" stroke-width="24"/>
    <path d="M -100 920 L 470 920 L 820 570 L 1430 570 L 1780 220 L 2020 220" stroke="#262626" stroke-width="8"/>
  </g>

  <!-- Bright Accent Pipeline (Z-Chevron Path) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -100 780 L 530 780 L 880 430 L 1370 430 L 1720 80 L 2020 80" stroke="hsl(46, 96%, 50%)" stroke-width="10"/>
  </g>

  <!-- Pipeline Terminals & Nodes -->
  <g>
    <!-- Hollow Terminal (Logo Style) -->
    <circle cx="530" cy="780" r="18" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
    
    <!-- Glowing Solid Nodes -->
    <circle cx="880" cy="430" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow)"/>
    <circle cx="1370" cy="430" r="14" fill="hsl(46, 96%, 50%)" filter="url(#yellow-glow)"/>
    
    <!-- Secondary Terminal Endpoint -->
    <circle cx="1720" cy="80" r="18" fill="#0D0D0D" stroke="hsl(46, 96%, 50%)" stroke-width="7"/>
  </g>

  <!-- Corner Decorative Accent Block -->
  <path d="M 1840 960 L 1880 960 L 1880 1000" fill="none" stroke="#4C4C4C" stroke-width="3"/>
</svg>
