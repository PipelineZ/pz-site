<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Vignette Gradient -->
    <radialGradient id="vignette-light" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#FAFAFA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E6E6E6" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Subtle Soft Glow -->
    <filter id="soft-glow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#FAFAFA"/>

  <!-- Large Abstraction of the Pipeline 'Z' Logo Mark -->
  <g transform="translate(1000, -80) scale(1.6)" opacity="0.12">
    <!-- Outer Track Shadow -->
    <path d="M 180 200 L 520 200 L 260 560 L 600 560" fill="none" stroke="#333333" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Accent Flow Line -->
    <path d="M 180 200 L 520 200 L 260 560 L 600 560" fill="none" stroke="hsl(46, 96%, 50%)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Logo Nodes -->
    <circle cx="180" cy="200" r="45" fill="#FAFAFA" stroke="hsl(46, 96%, 50%)" stroke-width="20"/>
    <circle cx="600" cy="560" r="55" fill="hsl(46, 96%, 50%)"/>
  </g>

  <!-- Left Side Technical Grid Accent Lines -->
  <g stroke="#E6E6E6" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="1080"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
  </g>

  <!-- Focal Yellow Accent Node in Bottom-Left Intersection -->
  <g transform="translate(120, 840)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="hsl(46, 96%, 50%)" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="hsl(46, 96%, 50%)" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="hsl(46, 96%, 50%)" filter="url(#soft-glow-light)"/>
  </g>

  <!-- Vignette Overlay -->
  <rect width="100%" height="100%" fill="url(#vignette-light)"/>
</svg>
